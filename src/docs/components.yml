components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [student, agent, super_admin]
      example:
        id: 5ebac534954b54139806c112
        phoneNumber: "+15551234567"
        name: fake name
        role: student

    Token:
      type: object
      properties:
        token:
          type: string
        expires:
          type: string
          format: date-time
      example:
        token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1ZWJhYzUzNDk1NGI1NDEzOTgwNmMxMTIiLCJpYXQiOjE1ODkyOTg0ODQsImV4cCI6MTU4OTMwMDI4NH0.m1U63blB0MLej_WfB7yC2FTMnCziif9X8yzwDEfJXAg
        expires: 2020-05-12T16:18:04.793Z

    AuthTokens:
      type: object
      properties:
        access:
          $ref: '#/components/schemas/Token'
        refresh:
          $ref: '#/components/schemas/Token'

    Error:
      type: object
      properties:
        code:
          type: number
        message:
          type: string

    Conversation:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [student_support, agent_group]
        studentId:
          type: string
        participantIds:
          type: array
          items:
            type: string
        name:
          type: string
        labels:
          type: array
          items:
            type: string
        createdBy:
          type: string
        lastMessageAt:
          type: string
          format: date-time
      example:
        id: 5ebac534954b54139806c112
        type: student_support
        studentId: 5ebac534954b54139806c113
        labels: []
        lastMessageAt: 2020-05-12T16:18:04.793Z

    Attachment:
      type: object
      properties:
        url:
          type: string
        mimeType:
          type: string
        size:
          type: number
        fileName:
          type: string
      example:
        url: https://pub-xxxxxxxx.r2.dev/attachments/6f1c1e1a-....jpg
        mimeType: image/jpeg
        size: 245678
        fileName: homework.jpg

    Message:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        senderId:
          type: string
        contentType:
          type: string
          enum: [text, image, audio, voice_note, video, pdf, file]
        text:
          type: string
        attachment:
          $ref: '#/components/schemas/Attachment'
        isPinned:
          type: boolean
        isDeleted:
          type: boolean
        isBroadcast:
          type: boolean
        broadcastGroupId:
          type: string
      example:
        id: 5ebac534954b54139806c114
        conversationId: 5ebac534954b54139806c112
        senderId: 5ebac534954b54139806c113
        contentType: text
        text: Hello!
        isPinned: false
        isDeleted: false
        isBroadcast: false

    Label:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
      example:
        id: 5ebac534954b54139806c115
        name: urgent
        color: "#ff0000"

    Template:
      type: object
      properties:
        id:
          type: string
        shortcut:
          type: string
        content:
          type: string
        isShared:
          type: boolean
        createdBy:
          type: string
      example:
        id: 5ebac534954b54139806c116
        shortcut: /1
        content: Thanks for reaching out, we'll get back to you shortly.
        isShared: true
        createdBy: 5ebac534954b54139806c113

  responses:
    DuplicatePhoneNumber:
      description: Phone number already taken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Phone number already taken
    DuplicateEmail:
      description: Email already taken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Email already taken
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: Please authenticate
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: Forbidden
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Not found

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
