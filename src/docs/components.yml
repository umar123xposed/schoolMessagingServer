components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [student, agent, super_admin]
        batchId:
          type: string
          description: student-only - id of the batch/cohort this student belongs to
        notes:
          type: string
          description: student-only - free text, e.g. sibling info
        isOnline:
          type: boolean
          description: agent/super_admin-only - live presence, kept up to date by the Socket.io layer
        lastSeenAt:
          type: string
          format: date-time
          description: agent/super_admin-only
      example:
        id: 5ebac534954b54139806c112
        phoneNumber: "+15551234567"
        name: fake name
        role: student
        batchId: 5ebac534954b54139806c120

    Batch:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 5ebac534954b54139806c120
        name: 2026-fall

    StudentImportResult:
      type: object
      properties:
        batchId:
          type: string
        batchName:
          type: string
        createdCount:
          type: number
        created:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              phoneNumber:
                type: string
              temporaryPassword:
                type: string
                description: only ever returned here, once - save it before sharing it with the student
        failed:
          type: array
          description: normally empty - the whole file is validated before any creation starts, so this only fills in on an unexpected mid-import error
          items:
            type: object
            properties:
              row:
                type: integer
              phoneNumber:
                type: string
              message:
                type: string
      example:
        batchId: 5ebac534954b54139806c120
        batchName: 2026-fall
        createdCount: 2
        created:
          - id: 5ebac534954b54139806c130
            name: Jane Doe
            phoneNumber: "+15551234567"
            temporaryPassword: 3f9a2c1b8e0dX9
          - id: 5ebac534954b54139806c131
            name: John Smith
            phoneNumber: "+15557654321"
            temporaryPassword: 9d4e7a5c2f1bX9
        failed: []

    Token:
      type: object
      properties:
        token:
          type: string
        expires:
          type: string
          format: date-time
      example:
        token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1ZWJhYzUzNDk1NGI1NDEzOTgwNmMxMTIiLCJpYXQiOjE1ODkyOTg0ODQsImV4cCI6MTU4OTMwMDI4NH0.m1U63blB0MLej_WfB7yC2FTMnCziif9X8yzwDEfJXAg
        expires: 2020-05-12T16:18:04.793Z

    AuthTokens:
      type: object
      properties:
        access:
          $ref: '#/components/schemas/Token'
        refresh:
          $ref: '#/components/schemas/Token'

    Error:
      type: object
      properties:
        code:
          type: number
        message:
          type: string

    Conversation:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [student_support, agent_group]
        studentId:
          type: string
        participantIds:
          type: array
          items:
            type: string
        name:
          type: string
        labels:
          type: array
          items:
            type: string
        createdBy:
          type: string
        lastMessageAt:
          type: string
          format: date-time
        lastReadAt:
          type: string
          format: date-time
          description: student_support only - when any staff member last read/replied. Shared across all agents, not per-agent.
        unreadCount:
          type: number
          description: student_support only - count of student messages since lastReadAt. Only present on GET responses, not a stored field clients can set.
      example:
        id: 5ebac534954b54139806c112
        type: student_support
        studentId: 5ebac534954b54139806c113
        labels: []
        unreadCount: 2
        lastMessageAt: 2020-05-12T16:18:04.793Z

    Attachment:
      type: object
      properties:
        url:
          type: string
        mimeType:
          type: string
        size:
          type: number
        fileName:
          type: string
        duration:
          type: number
          description: seconds - audio/voice_note/video only, computed client-side
      example:
        url: https://pub-xxxxxxxx.r2.dev/attachments/6f1c1e1a-....jpg
        mimeType: image/jpeg
        size: 245678
        fileName: homework.jpg

    PresignedUpload:
      type: object
      properties:
        uploadUrl:
          type: string
          description: Short-lived presigned PUT URL - PUT the raw file bytes here directly, with a matching Content-Type header
        expiresIn:
          type: number
          description: seconds until uploadUrl expires
        attachment:
          $ref: '#/components/schemas/Attachment'
      example:
        uploadUrl: https://xxxxxxxx.r2.cloudflarestorage.com/attachments/6f1c1e1a-....jpg?X-Amz-Signature=...
        expiresIn: 300
        attachment:
          url: https://pub-xxxxxxxx.r2.dev/attachments/6f1c1e1a-....jpg
          mimeType: image/jpeg
          size: 245678
          fileName: homework.jpg

    Message:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        senderId:
          type: string
        contentType:
          type: string
          enum: [text, image, audio, voice_note, video, pdf, file]
        text:
          type: string
        attachment:
          $ref: '#/components/schemas/Attachment'
        isPinned:
          type: boolean
        isDeleted:
          type: boolean
        isBroadcast:
          type: boolean
        broadcastGroupId:
          type: string
      example:
        id: 5ebac534954b54139806c114
        conversationId: 5ebac534954b54139806c112
        senderId: 5ebac534954b54139806c113
        contentType: text
        text: Hello!
        isPinned: false
        isDeleted: false
        isBroadcast: false

    Label:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
      example:
        id: 5ebac534954b54139806c115
        name: urgent
        color: "#ff0000"

    Template:
      type: object
      properties:
        id:
          type: string
        shortcut:
          type: string
          description: unique per-creator - different agents may each have their own "/1"
        content:
          type: string
        createdBy:
          type: string
      example:
        id: 5ebac534954b54139806c116
        shortcut: /1
        content: Thanks for reaching out, we'll get back to you shortly.
        createdBy: 5ebac534954b54139806c113

    BatchStorageStat:
      type: object
      properties:
        batchId:
          type: string
          description: null for students not assigned to any batch
        batchName:
          type: string
          description: "\"unassigned\" when batchId is null"
        studentCount:
          type: number
        conversationCount:
          type: number
        messageCount:
          type: number
        attachmentCount:
          type: number
        attachmentBytes:
          type: number
      example:
        batchId: 5ebac534954b54139806c120
        batchName: 2026-spring
        studentCount: 480
        conversationCount: 480
        messageCount: 15230
        attachmentCount: 3110
        attachmentBytes: 2147483648

    BatchDeletionJob:
      type: object
      properties:
        id:
          type: string
        batchId:
          type: string
        batchName:
          type: string
          description: snapshot of the batch's name at deletion time - the Batch document itself is deleted by the time the job completes
        status:
          type: string
          enum: [pending, running, completed, failed]
        triggeredBy:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        counts:
          type: object
          properties:
            students:
              type: number
            conversations:
              type: number
            messages:
              type: number
            attachmentsDeleted:
              type: number
        error:
          type: string
      example:
        id: 5ebac534954b54139806c118
        batchId: 5ebac534954b54139806c120
        batchName: 2025-fall
        status: completed
        triggeredBy: 5ebac534954b54139806c113
        counts:
          students: 480
          conversations: 480
          messages: 15230
          attachmentsDeleted: 3110

  responses:
    DuplicatePhoneNumber:
      description: Phone number already taken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Phone number already taken
    DuplicateEmail:
      description: Email already taken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Email already taken
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: Please authenticate
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: Forbidden
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Not found

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
